<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 HAPPIEST BIRTHDAY HARSHWARDHAN!! 🎉</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="title">🎂 HAPPIEST BIRTHDAY HARSHWARDHAN!! 🎉</h1>
            <p class="subtitle">A Special Day For A Special Person</p>
        </div>

        <!-- Animated Cake -->
        <div class="cake-container">
            <div class="cake">
                <div class="cake-layer cake-layer-1"></div>
                <div class="cake-layer cake-layer-2"></div>
                <div class="cake-layer cake-layer-3"></div>
                <div class="candles">
                    <div class="candle">
                        <div class="flame"></div>
                    </div>
                    <div class="candle">
                        <div class="flame"></div>
                    </div>
                    <div class="candle">
                        <div class="flame"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Confetti -->
        <div class="confetti-container" id="confetti"></div>

        <!-- Birthday Wishes Section -->
        <div class="wishes-section">
            <h2 class="wishes-title">✨ Birthday Wishes ✨</h2>
            <div class="wishes-container" id="wishesContainer">
                <div class="wish-card">
                    <p class="wish-text">Wishing you the happiest birthday ever! 🎈</p>
                </div>
                <div class="wish-card">
                    <p class="wish-text">May all your dreams come true! 🌟</p>
                </div>
                <div class="wish-card">
                    <p class="wish-text">Have an amazing day filled with joy! 🎊</p>
                </div>
                <div class="wish-card">
                    <p class="wish-text">Wishing you love, laughter, and happiness! 💝</p>
                </div>
            </div>
        </div>

        <!-- Add Wish Button -->
        <div class="add-wish-section">
            <h3>Add Your Wish</h3>
            <input type="text" id="wishInput" placeholder="Write your birthday wish here..." class="wish-input">
            <button class="add-wish-btn" onclick="addWish()">Add Wish 💌</button>
        </div>

        <!-- Balloons -->
        <div class="balloon balloon-1"></div>
        <div class="balloon balloon-2"></div>
        <div class="balloon balloon-3"></div>
        <div class="balloon balloon-4"></div>
        <div class="balloon balloon-5"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
